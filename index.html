<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>Registar Atesta i Izjava o svojstvima</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-6xl mx-auto">
    <header class="mb-8 border-b border-slate-700 pb-4">
      <h1 class="text-3xl font-bold text-sky-400">📋 Registar atesta i Izjava o svojstvima (DoP)</h1>
      <p class="text-slate-400 mt-1">Učitavanje, evidencija i preuzimanje atestne dokumentacije po proizvodima</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <!-- Bočni stupac: Unos i popis proizvoda -->
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 h-fit">
        <h2 class="text-xl font-semibold mb-4 text-white">⚙️ Proizvodi</h2>
        
        <div class="flex gap-2 mb-6">
          <input id="noviProizvod" type="text" placeholder="Npr. SMART SLIDE, ALU OKOV..." 
                 class="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-sky-500">
          <button onclick="dodajProizvod()" class="bg-sky-600 hover:bg-sky-500 text-white font-bold px-4 py-2 rounded-lg whitespace-nowrap">
            + Dodaj
          </button>
        </div>

        <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-2">Popis proizvoda:</h3>
        <ul id="listaProizvoda" class="space-y-2 max-h-96 overflow-y-auto pr-1"></ul>
      </div>

      <!-- Glavni radni prostor -->
      <div class="md:col-span-2 bg-slate-800 p-6 rounded-xl border border-slate-700">
        <div id="odabraniPrikaz">
          <p class="text-slate-400 text-center py-12">Odaberite ili dodajte proizvod s lijeve strane za rad s dokumentacijom.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let db;
    let odabraniId = null;

    // Inicijalizacija IndexedDB baze u pregledniku
    const request = indexedDB.open("AtestiBaza", 1);
    request.onupgradeneeded = e => {
      db = e.target.result;
      db.createObjectStore("proizvodi", { keyPath: "id", autoIncrement: true });
      const dokStore = db.createObjectStore("dokumenti", { keyPath: "id", autoIncrement: true });
      dokStore.createIndex("proizvodId", "proizvodId", { unique: false });
    };
    request.onsuccess = e => {
      db = e.target.result;
      ucitajProizvode();
    };

    function dodajProizvod() {
      const input = document.getElementById("noviProizvod");
      const naziv = input.value.trim();
      if (!naziv) return alert("Upišite naziv proizvoda!");

      const tx = db.transaction("proizvodi", "readwrite");
      tx.objectStore("proizvodi").add({ naziv: naziv });
      tx.oncomplete = () => {
        input.value = "";
        ucitajProizvode();
      };
    }

    function ucitajProizvode() {
      const tx = db.transaction("proizvodi", "readonly");
      const req = tx.objectStore("proizvodi").getAll();
      req.onsuccess = () => {
        const lista = document.getElementById("listaProizvoda");
        lista.innerHTML = "";
        const proizvodi = req.result;

        if (proizvodi.length === 0) {
          lista.innerHTML = '<li class="text-slate-500 text-sm">Nema unesenih proizvoda.</li>';
          odaberiProizvod(null);
          return;
        }

        proizvodi.forEach(p => {
          const aktivan = p.id === odabraniId ? 'bg-sky-900 border-sky-500 text-white' : 'bg-slate-900 border-slate-700 text-slate-300 hover:bg-slate-700';
          lista.innerHTML += `
            <li class="flex items-center justify-between p-2.5 rounded-lg border cursor-pointer ${aktivan}" onclick="odaberiProizvod(${p.id})">
              <span class="font-medium truncate mr-2">${p.naziv}</span>
              <button onclick="event.stopPropagation(); obrisiProizvod(${p.id})" class="text-rose-400 hover:text-rose-300 text-xs px-2 py-1 bg-rose-950/40 rounded border border-rose-800">Obriši</button>
            </li>
          `;
        });

        if (!odabraniId && proizvodi.length > 0) odaberiProizvod(proizvodi[0].id);
      };
    }

    function obrisiProizvod(id) {
      if (!confirm("Sigurno želite obrisati proizvod i sve njegove dokumente?")) return;
      const tx = db.transaction(["proizvodi", "dokumenti"], "readwrite");
      tx.objectStore("proizvodi").delete(id);
      
      const dokStore = tx.objectStore("dokumenti");
      const idx = dokStore.index("proizvodId");
      const req = idx.openCursor(IDBKeyRange.only(id));
      req.onsuccess = e => {
        const cursor = e.target.result;
        if (cursor) {
          dokStore.delete(cursor.primaryKey);
          cursor.continue();
        }
      };

      tx.oncomplete = () => {
        if (odabraniId === id) odabraniId = null;
        ucitajProizvode();
      };
    }

    function odaberiProizvod(id) {
      odabraniId = id;
      if (!id) {
        document.getElementById("odabraniPrikaz").innerHTML = '<p class="text-slate-400 text-center py-12">Odaberite proizvod.</p>';
        return;
      }

      const tx = db.transaction("proizvodi", "readonly");
      tx.objectStore("proizvodi").get(id).onsuccess = e => {
        const p = e.target.result;
        prikaziRadnuPovrsinu(p);
      };
    }

    function prikaziRadnuPovrsinu(proizvod) {
      const prikaz = document.getElementById("odabraniPrikaz");
      prikaz.innerHTML = `
        <div class="border-b border-slate-700 pb-4 mb-6 flex justify-between items-center">
          <div>
            <span class="text-xs uppercase text-sky-400 font-semibold tracking-wider">Aktivni proizvod</span>
            <h2 class="text-2xl font-bold text-white">${proizvod.naziv}</h2>
          </div>
        </div>

        <div class="mb-6 p-4 border-2 border-dashed border-slate-600 rounded-xl bg-slate-900/50 text-center">
          <p class="text-slate-300 font-medium mb-2">Učitajte ateste, DoP ili certifikate (PDF, slike...)</p>
          <input type="file" id="fileUpload" multiple class="text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-sky-600 file:text-white hover:file:bg-sky-500 cursor-pointer">
          <button onclick="spremiDokumente(${proizvod.id})" class="mt-3 block mx-auto bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-6 py-2 rounded-lg">
            💾 Spremi odabrane dokumente
          </button>
        </div>

        <h3 class="text-lg font-semibold text-white mb-3">Spremljeni dokumenti:</h3>
        <div id="popisDokumenata" class="space-y-2"></div>
      `;
      ucitajDokumente(proizvod.id);
    }

    function spremiDokumente(proizvodId) {
      const files = document.getElementById("fileUpload").files;
      if (files.length === 0) return alert("Odaberite barem jednu datoteku!");

      const tx = db.transaction("dokumenti", "readwrite");
      const store = tx.objectStore("dokumenti");

      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = e => {
          store.add({
            proizvodId: proizvodId,
            naziv: file.name,
            tip: file.type,
            datum: new Date().toLocaleDateString("hr-HR"),
            podaci: e.target.result
          });
        };
        reader.readAsDataURL(file);
      });

      tx.oncomplete = () => {
        alert("Dokumenti su uspješno spremljeni!");
        setTimeout(() => ucitajDokumente(proizvodId), 300);
      };
    }

    function ucitajDokumente(proizvodId) {
      const tx = db.transaction("dokumenti", "readonly");
      const idx = tx.objectStore("dokumenti").index("proizvodId");
      const req = idx.getAll(IDBKeyRange.only(proizvodId));

      req.onsuccess = () => {
        const container = document.getElementById("popisDokumenata");
        const doks = req.result;
        if (doks.length === 0) {
          container.innerHTML = '<p class="text-slate-500 text-sm italic">Nema prenesenih dokumenata za ovaj proizvod.</p>';
          return;
        }

        container.innerHTML = "";
        doks.forEach(d => {
          container.innerHTML += `
            <div class="flex items-center justify-between p-3 bg-slate-900 border border-slate-700 rounded-lg">
              <div>
                <p class="font-medium text-slate-200">📄 ${d.naziv}</p>
                <span class="text-xs text-slate-500">Spremljeno: ${d.datum}</span>
              </div>
              <div class="flex gap-2">
                <a href="${d.podaci}" download="${d.naziv}" class="bg-sky-700 hover:bg-sky-600 text-white text-xs px-3 py-1.5 rounded-lg flex items-center gap-1 font-medium">Preuzmi</a>
                <button onclick="obrisiDokument(${d.id}, ${proizvodId})" class="bg-rose-900/60 hover:bg-rose-800 text-rose-200 text-xs px-2.5 py-1.5 rounded-lg border border-rose-700">Briši</button>
              </div>
            </div>
          `;
        });
      };
    }

    function obrisiDokument(dokId, proizvodId) {
      const tx = db.transaction("dokumenti", "readwrite");
      tx.objectStore("dokumenti").delete(dokId);
      tx.oncomplete = () => ucitajDokumente(proizvodId);
    }
  </script>
</body>
</html>
